name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  layout:
    name: layout (${{ matrix.viewport }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        viewport: [360x640, 390x844, 430x932, 844x390, 932x430, 1280x800]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      # Headless shell only (the layout script launches without a channel); key is OS + arch + installed Playwright version
      - name: Cache Chromium headless shell
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}-chromium-shell

      - name: Install Chromium headless shell
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            npx playwright install --only-shell chromium && exit 0
            echo "install attempt $i failed"; sleep $((i * 10))
          done
          exit 1

      # OS packages are not restorable from the browser cache, so this always runs
      - name: Install Chromium system deps
        timeout-minutes: 6
        run: npx playwright install-deps chromium

      - name: Layout QA (${{ matrix.viewport }})
        run: npm run layout
        timeout-minutes: 8
        env:
          LAYOUT_VIEWPORT: ${{ matrix.viewport }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: layout-artifacts-${{ matrix.viewport }}
          path: layout-artifacts/
          if-no-files-found: ignore

  deploy:
    needs: [build, layout]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
